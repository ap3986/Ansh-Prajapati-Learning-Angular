<form [formGroup]="cosmeticForm" (ngSubmit)="onSubmit()">
  <div class="form-group">
    <mat-list>

      <mat-list-item>
      <mat-label> Serial Number</mat-label>
      </mat-list-item>
      <input type="number" id="serialNumber" formControlName="serialNumber" [appHighlightOnFocus] = "'lightgrey'"  />
  <mat-divider></mat-divider>


    <mat-list-item>
      <mat-label> Product Name </mat-label>
    </mat-list-item>
    <input type="text" id="productName" formControlName="productName" [appHighlightOnFocus] = "'lightgrey'" />
    <mat-divider></mat-divider>



    <mat-list-item>
      <mat-label> Price </mat-label>
    </mat-list-item>
    <input type="text" id="price" formControlName="price" [appHighlightOnFocus] = "'lightgrey'" />
    <mat-divider></mat-divider>


    <mat-list-item>
      <mat-label> Color </mat-label>
    </mat-list-item>
    <input type="text" id="color" formControlName="color" [appHighlightOnFocus] = "'lightgrey'" />
    <mat-divider></mat-divider>


    <mat-list-item>
      <mat-label> Skin Type </mat-label>
    </mat-list-item>
    <input type="text" id="skinType" formControlName="skinType" [appHighlightOnFocus] = "'lightgrey'" />
    <mat-divider></mat-divider>


    <mat-checkbox formControlName="isAdmin" class="checkbox">User Information Is Available</mat-checkbox>




      <button mat-stroked-button type="submit" [appHighlightOnFocus] = "'darkgreen'" >Submit</button>

    </mat-list>
</div>


</form>
