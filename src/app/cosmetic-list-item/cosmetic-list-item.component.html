<mat-card appearance="outlined">
<mat-card-header>
  <mat-card-title> Product Information </mat-card-title>
</mat-card-header>
</mat-card>
<mat-card-content>


<div *ngIf="cosmetic" class="productDescription">
  <mat-list>
    <mat-list-item><p [appHoverHighlight]="'skyblue'">Serial Number : {{cosmetic.serialNumber}}</p></mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><p [appHoverHighlight]="'skyblue'">Price : {{cosmetic.price | currency: 'CAD': "symbol-narrow"}}</p></mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><p [appHoverHighlight]="'skyblue'">Color : {{cosmetic.color | uppercase}}</p></mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><p [appHoverHighlight]="'skyblue'">Skin Type : {{cosmetic.skinType | lowercase}} </p></mat-list-item>
    <mat-divider></mat-divider>
    <mat-list-item><p [appHoverHighlight]="'skyblue'">User Information : {{cosmetic.userInformation}}</p></mat-list-item>
  </mat-list>

  <div class="example-button-row">

  <button mat-stroked-button (click)="goBackward()" [disabled]="currentIndex === 0" [appHoverHighlight]="'blue'">Previous</button>
  <button mat-stroked-button (click)="goForward() " [disabled]="currentIndex === userList.length -1" [appHoverHighlight]="'blue'">Next</button>
  <button mat-stroked-button (click)="goBack()" [appHoverHighlight]="'blue'">Back to Products</button>
</div>
</div>
  <mat-icon svgIcon="thumbs-up" aria-hidden="false" aria-label="Example thumbs up SVG icon"></mat-icon>
</mat-card-content>
